# CHANGED FROM UPSTREAM (Mica Technologies fork, LDEncore): restructured alongside the
# ForgeGradle 6 build.gradle. Upstream's four Minecraft/Forge values are kept verbatim; the
# rest is fork wiring (toolchain discovery, naming, versioning, dependency coordinates).

# Gradle settings
# Enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# CI toolchain discovery. ForgeGradle 6 needs Gradle itself on JDK 17+, while the mod
# compiles against a Java 8 toolchain (java_target below). actions/setup-java exports the
# JDKs it installs as JAVA_HOME_<version>_<arch>, which Gradle does not auto-detect, so
# point it at them explicitly. Harmless locally, where these variables don't exist and
# Gradle falls back to its normal detection (plus foojay auto-provisioning).
org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64

# Minecraft
minecraft_version=1.16.4
minecraft_suffix=mc1.16
java_target=8

# Forge
forge_version=35.1.37
mappings_channel=snapshot
mappings_version=20201028-1.16.3

# Mod properties.
# mod_id and the Java package are deliberately NOT rebranded: the id is a compatibility
# contract with saves and packs, and the package keeps upstream merges mechanical.
mod_id=theatrical
mod_name=LDEncore
mod_group=dev.theatricalmod.theatrical
archives_base_name=LDEncore
# Fallback version only. Release builds take their version from the git tag the GitHub
# Actions workflow creates (YYYY.MM.DD); see the resolution block at the top of build.gradle.
# This value is what local builds and untagged clones get, and it records the upstream
# Theatrical release this fork currently sits on -- bump it if upstream is ever merged again.
mod_version=0.7.2
# The upstream Theatrical release this fork is based on. Printed into every GitHub release
# body by the release workflow (printUpstreamVersion). Keep in step with mod_version.
upstream_version=0.7.2

# Dev-run ModLauncher override; see the runtimeOnly note in build.gradle.
modlauncher_devrun_version=8.1.3

# Dependencies
# The One Probe, from McJty's maven (mcjty.theoneprobe:theoneprobe). Upstream pinned
# 1.16-3.0.6-8 from a maven that no longer exists; this is the newest 1.16 build published.
top_version=1.16-3.1.7-4
patchouli_version=48
patchouli_provider_version=1.16.4-1.0.2-Snapshot.3
