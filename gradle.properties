# LDEncore (Mica Technologies fork of Theatrical) -- Forge 1.12.2 line.
# CHANGED FROM UPSTREAM: upstream's file held only the Gradle heap setting; everything else here
# is fork wiring for the GregTechCEu buildscripts. Mod settings live in buildscript.properties.

org.gradle.logging.stacktrace = all

# Decompilation and the RFG asset pipeline are memory-hungry; 3G matches the other
# Mica Technologies 1.12.2 mods and is what CI is sized for.
org.gradle.jvmargs = -Xmx3G

# Disable the GTCEu buildscript's configuration-time "is a newer build.gradle available?"
# check. It fetches raw.githubusercontent.com during project evaluation, which has timed out
# and hard-failed CI on the sibling mods. We do not want the auto-update anyway -- it would
# overwrite build.gradle. Run `gradle updateBuildScript` manually if a refresh is ever wanted.
systemProp.DISABLE_BUILDSCRIPT_UPDATE_CHECK = true

# The upstream Theatrical release this port is translated from (the final state of upstream's
# 1.16.3 branch). Printed into every GitHub release body by the release workflow via
# printUpstreamVersion in addon.gradle.
upstream_version = 0.7.2
