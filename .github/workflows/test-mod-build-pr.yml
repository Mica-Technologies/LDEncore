# Mica Technologies standard PR build check.
#
# On this branch (`1.12`) the build is the GregTechCEu buildscripts on JDK 21, same as
# RCMC/LDFAWE. The `1.16.3` branch's copy installs JDK 8 + 17 for ForgeGradle 6 instead.

name: Test Mod Build (Pull Request)

on: pull_request

permissions:
  contents: read

jobs:
  test_assemble_mod:
    name: Test Assemble Mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # RFG runs the Gradle process on Java 21+ (compiler + mod code stay Java 8 via
      # Jabel); older Gradle-JVM Java versions are deprecated and slated for removal.
      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble mod with Gradle
        run: ./gradlew build -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.http.connectionTimeout=60000
